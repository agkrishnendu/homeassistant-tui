[package]
name = "homeassistant-tui"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A fast, keyboard-driven terminal UI for Home Assistant"
license = "0BSD"
repository = "https://github.com/agkrishnendu/homeassistant-tui"
readme = "README.md"
keywords = ["home-assistant", "tui", "ratatui", "smart-home", "terminal"]
categories = ["command-line-utilities"]
exclude = ["/.github"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3.34"
nucleo-matcher = "0.3"
ratatui = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
